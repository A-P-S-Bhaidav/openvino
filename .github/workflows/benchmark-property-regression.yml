name: Benchmark property regression checks

on:
  push:
    branches: [verify/benchmark-empty-device-properties]

permissions:
  contents: read

jobs:
  cpu-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: python -m pip install openvino==2026.4.1 pytest==9.2.0
      - name: Run benchmark unit tests against the checkout
        run: |
          python - <<'PY'
          import sys
          import openvino
          import openvino.tools
          import pytest
          print(openvino.__version__)
          openvino.tools.__path__.insert(0, 'tools/benchmark_tool/openvino/tools')
          sys.exit(pytest.main(['-q', 'tools/benchmark_tool/unit_tests']))
          PY
      - name: Benchmark a synthetic model with empty nested device properties
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path
          import openvino as ov
          import openvino.tools
          tools = str(Path('tools/benchmark_tool/openvino/tools').resolve())
          openvino.tools.__path__.insert(0, tools)
          from openvino.tools.benchmark.utils.utils import dump_config
          parameter = ov.opset13.parameter([1, 3], ov.Type.f32)
          model = ov.Model([ov.opset13.relu(parameter)], [parameter])
          ov.serialize(model, 'regression-model.xml')
          dump_config('regression-config.json', {'AUTO': {'DEVICE_PROPERTIES': ov.OVAny({'CPU': {}})}})
          launcher = 'import sys, openvino.tools; openvino.tools.__path__.insert(0, sys.argv.pop(1)); from openvino.tools.benchmark.main import main; main()'
          subprocess.run([sys.executable, '-c', launcher, tools, '-m', 'regression-model.xml', '-d', 'AUTO:CPU', '-hint', 'latency', '-niter', '1', '-load_config', 'regression-config.json'], check=True)
          PY
