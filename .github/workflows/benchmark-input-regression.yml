name: Benchmark input regression checks

on:
  push:
    branches:
      - verify/benchmark-input-name-mapping
      - verify/benchmark-random-boolean-inputs

permissions:
  contents: read

jobs:
  cpu-regression:
    if: github.repository == 'A-P-S-Bhaidav/openvino'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pinned runtime and test dependencies
        run: python -m pip install openvino==2026.4.1 numpy==2.4.2 pytest==9.2.0
      - name: Reproduce the baseline and verify the fix
        env:
          BASE_SHA: 98a58dac99b6dda19f91cf7f06158c1644a5c820
          REGRESSION_TEST: tools/benchmark_tool/unit_tests/test_random_boolean_inputs.py
        run: python .github/scripts/benchmark_tool_fork_validation.py validate
